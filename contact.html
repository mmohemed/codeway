<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | CodeWay</title>
    <meta name="description" content="تواصل مع فريق CodeWay: اقتراح، أو سؤال، أو إبلاغ عن مشكلة.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="css/site-frame.css">
    <style>:root{--accent:#5b5bd6;}</style>
</head>
<body class="">
    <script src="js/site-frame.js" data-root=""></script>
    <section class="page-hero">
        <div class="container">
            <div class="crumbs"><a href="index.html">الرئيسية</a><i class="fas fa-chevron-left"></i><span>تواصل معنا</span></div>
            <div class="hero-row"><div class="hero-badge"><i class="fas fa-envelope"></i></div>
                <div style="flex:1;min-width:260px"><h1>تواصل معنا</h1><p class="sub">يسعدنا سماع اقتراحك أو سؤالك أو ملاحظتك.</p></div></div>
        </div>
    </section>
    <main><section class="section container">
        <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:start" class="contact-wrap">
            <form class="card form-grid" style="padding:26px" onsubmit="event.preventDefault();this.innerHTML='<div style=\'text-align:center;padding:30px\'><i class=\'fas fa-circle-check\' style=\'font-size:2.4rem;color:#16a34a\'></i><h3 style=\'margin-top:12px\'>وصلتنا رسالتك، شكراً لك!</h3></div>'">
                <div><label>الاسم</label><input required placeholder="اسمك الكريم"></div>
                <div><label>البريد الإلكتروني</label><input type="email" required placeholder="you@example.com" style="direction:ltr;text-align:right"></div>
                <div><label>الموضوع</label><input required placeholder="موضوع الرسالة"></div>
                <div><label>الرسالة</label><textarea rows="5" required placeholder="اكتب رسالتك هنا..."></textarea></div>
                <button class="btn accent-btn" type="submit"><i class="fas fa-paper-plane"></i> إرسال</button>
            </form>
            <div class="card" style="padding:26px">
                <h3 style="margin-bottom:16px">طرق أخرى للتواصل</h3>
                <p style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><i class="fas fa-envelope" style="color:#5b5bd6;width:22px"></i> hello@codeway.example</p>
                <p style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><i class="fab fa-x-twitter" style="color:#5b5bd6;width:22px"></i> CodeWay@</p>
                <p style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><i class="fab fa-telegram" style="color:#5b5bd6;width:22px"></i> مجتمع CodeWay</p>
                <p style="color:var(--muted);margin-top:16px">نرد عادة خلال يومي عمل.</p>
            </div>
        </div>
    </section></main>
    <style>@media(max-width:760px){.contact-wrap{grid-template-columns:1fr!important}}</style>
    <script>
        const nl = document.getElementById('navLinks'), nt = document.getElementById('navToggle');
        if (nt) { nt.addEventListener('click', () => nl.classList.toggle('open')); nl.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nl.classList.remove('open'))); }
    </script>
</body>
</html>
